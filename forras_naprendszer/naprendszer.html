<h1>Naprendszer<a href="https://hu.wikipedia.org/wiki/Naprendszer">*</a></h1>
<p>A Naprendszer a Napból és a körülötte keringő égitestekből álló rendszer. Kialakulása körülbelül 4,6 milliárd évvel ezelőtt kezdődött egy hatalmas gáz- és porfelhő összehúzódásával. Az anyag túlnyomó részét a Nap tartalmazza, a többi égitest együttes tömege ennek csak töredéke.</p>
